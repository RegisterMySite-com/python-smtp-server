<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Composer</title>
  <!-- Quill rich text editor via CDN -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helve>
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    .field {
      margin-bottom: 1.15rem;
    }
label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .row .field { flex: 1; min-width: 180px; }

    .toggle-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn.active,
    .toggle-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
#cc-field, #bcc-field {
      display: none;
    }

    #cc-field.visible, #bcc-field.visible {
      display: block;
    }

    /* Quill overrides for dark theme */
    #editor-container {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .ql-toolbar.ql-snow {
      background: #151c27;
      border: none;
      border-bottom: 1px solid var(--border);
    }

    .ql-container.ql-snow {
      border: none;
      font-size: 0.95rem;
      min-height: 200px;
    }

    .ql-editor {
      color: var(--text);
      min-height: 200px;
    }

    .ql-editor.ql-blank::before {
      color: var(--muted);
      font-style: normal;
    }

    .ql-snow .ql-stroke { stroke: var(--muted); }
    .ql-snow .ql-fill { fill: var(--muted); }
    .ql-snow .ql-picker { color: var(--muted); }
    .ql-snow .ql-picker-options { background: var(--surface); border-color: var(>
    .ql-snow.ql-toolbar button:hover .ql-stroke,
    .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke: var(--accent); }
    .ql-snow.ql-toolbar button:hover .ql-fill,
    .ql-snow.ql-toolbar button.ql-active .ql-fill { fill: var(--accent); }

    .mode-switch {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .mode-switch button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .mode-switch button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .mode-switch button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    #plain-body {
      display: none;
      width: 100%;
      min-height: 200px;
      padding: 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monosp>
      font-size: 0.9rem;
      resize: vertical;
    }

    #plain-body:focus { outline: none; border-color: var(--accent); }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button.primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.7rem 1.1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
button.secondary:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    #status {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    #status.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--success);
    }

    #status.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--error);
    }

    .file-list {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .file-list span {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      margin: 0.2rem 0.3rem 0.2rem 0;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Email Composer</h1>
      <p>Compose and send emails with optional rich HTML body &amp; attachments<>
    </header>

    <div class="card">
      <form id="email-form" enctype="multipart/form-data">
        <div class="field">
          <label for="to">To *</label>
          <input type="text" id="to" name="to" placeholder="recipient@example.co>
        </div>

        <div class="toggle-row">
          <button type="button" class="toggle-btn" id="toggle-cc">+ CC</button>
          <button type="button" class="toggle-btn" id="toggle-bcc">+ BCC</button>
        </div>

        <div class="field" id="cc-field">
          <label for="cc">CC</label>
          <input type="text" id="cc" name="cc" placeholder="cc@example.com" />
        </div>

        <div class="field" id="bcc-field">
          <label for="bcc">BCC</label>
          <input type="text" id="bcc" name="bcc" placeholder="bcc@example.com" />
        </div>

        <div class="field">
          <label for="subject">Subject *</label>
          <input type="text" id="subject" name="subject" placeholder="Email subj>
        </div>

        <div class="field">
          <label>Body *</label>
          <div class="mode-switch">
            <button type="button" class="active" id="mode-rich">Rich HTML</butto>
            <button type="button" id="mode-plain">Plain Text</button>
          </div>
          <div id="editor-container">
            <div id="editor"></div>
          </div>
          <textarea id="plain-body" placeholder="Write your message in plain tex>
        </div>

        <div class="field">
          <label for="attachments">Attachments (optional)</label>
          <input type="file" id="attachments" name="attachments" multiple />
          <div class="file-list" id="file-list"></div>
        </div>

        <div class="actions">
          <button type="button" class="secondary" id="reset-btn">Reset</button>
          <button type="submit" class="primary" id="send-btn">Send Email</button>
        </div>
      </form>

      <div id="status"></div>
    </div>

    <footer>
      Works in demo mode (logs to console) or real SMTP when credentials are set.
    </footer>
  </div>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script>
    // Initialize Quill
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: 'Write your message...',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          [{ color: [] }, { background: [] }],
          ['link'],
          ['clean']
        ]
      }
    });

    let isHtmlMode = true;

    // Mode switch
    document.getElementById('mode-rich').addEventListener('click', () => {
      isHtmlMode = true;
      document.getElementById('mode-rich').classList.add('active');
      document.getElementById('mode-plain').classList.remove('active');
      document.getElementById('editor-container').style.display = 'block';
      document.getElementById('plain-body').style.display = 'none';
    });

    document.getElementById('mode-plain').addEventListener('click', () => {
      isHtmlMode = false;
      document.getElementById('mode-plain').classList.add('active');
      document.getElementById('mode-rich').classList.remove('active');
      document.getElementById('editor-container').style.display = 'none';
      document.getElementById('plain-body').style.display = 'block';
    });

    // CC / BCC toggles
    document.getElementById('toggle-cc').addEventListener('click', function () {
      const field = document.getElementById('cc-field');
      field.classList.toggle('visible');
      this.classList.toggle('active');
      this.textContent = field.classList.contains('visible') ? '− CC' : '+ CC';
    });

    document.getElementById('toggle-bcc').addEventListener('click', function () {
      const field = document.getElementById('bcc-field');
      field.classList.toggle('visible');
      this.classList.toggle('active');
      this.textContent = field.classList.contains('visible') ? '− BCC' : '+ BCC';
    });

    // File list preview
    document.getElementById('attachments').addEventListener('change', function (>
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      Array.from(this.files).forEach(f => {
        const span = document.createElement('span');
        span.textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
        list.appendChild(span);
      });
    });
 // Reset
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('email-form').reset();
      quill.setContents([]);
      document.getElementById('file-list').innerHTML = '';
      document.getElementById('status').style.display = 'none';
      // hide CC/BCC
      document.getElementById('cc-field').classList.remove('visible');
      document.getElementById('bcc-field').classList.remove('visible');
      document.getElementById('toggle-cc').classList.remove('active');
      document.getElementById('toggle-bcc').classList.remove('active');
      document.getElementById('toggle-cc').textContent = '+ CC';
      document.getElementById('toggle-bcc').textContent = '+ BCC';
    });

    // Submit
    document.getElementById('email-form').addEventListener('submit', async (e) =>
      e.preventDefault();
      const status = document.getElementById('status');
      const sendBtn = document.getElementById('send-btn');

      const body = isHtmlMode ? quill.root.innerHTML : document.getElementById('>

      if (!body || body === '<p><br></p>') {
        status.className = 'error';
        status.textContent = 'Body is required';
        return;
      }

      const formData = new FormData();
      formData.append('to', document.getElementById('to').value);
      formData.append('cc', document.getElementById('cc').value);
      formData.append('bcc', document.getElementById('bcc').value);
      formData.append('subject', document.getElementById('subject').value);
      formData.append('body', body);
      formData.append('is_html', isHtmlMode ? 'true' : 'false');

      const files = document.getElementById('attachments').files;
      for (let i = 0; i < files.length; i++) {
        formData.append('attachments', files[i]);
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      status.style.display = 'none';

      try {
        const res = await fetch('/send', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          status.className = 'success';
          status.textContent = data.message || 'Email sent successfully!';
        } else {
          status.className = 'error';
          status.textContent = data.error || 'Failed to send email';
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Network error: ' + err.message;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Email';
      }
    });
  </script>
</body>
</html>
